services:

  # ── Databases ──────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: cms-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared-capstone-network


  redis:
    image: redis:7
    container_name: cms-redis
    ports:
      - "6379:6379"
    networks:
      - shared-capstone-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cms-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shared-capstone-network

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: cms-meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-changeme}
      - MEILI_ENV=development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    networks:
      - shared-capstone-network

  # ── MySQL Administration Tool ──────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2.3
    container_name: cms-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shared-capstone-network

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: cms-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-capstone-network

  # ── Laravel Services ───────────────────────────
  vendor-management:
    build: ./services/vendor-management
    container_name: cms-vendor-management
    volumes:
      - ./services/vendor-management:/var/www/html
      - vendor-management-vendor:/var/www/html/vendor
    ports:
      - "8001:8000"
    command: sh -c "composer install --no-scripts && sleep 5 && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shared-capstone-network

  contract-management:
    build: ./services/contract-management
    container_name: cms-contract-management
    volumes:
      - ./services/contract-management:/var/www/html
      - contract-management-vendor:/var/www/html/vendor
    ports:
      - "8002:8000"
    command: sh -c "composer install --no-scripts && sleep 10 && php artisan migrate --force && (php artisan schedule:work &) && (php artisan queue:work --sleep=3 --tries=3 --timeout=60 &) && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shared-capstone-network

  search:
    build: ./services/search
    container_name: cms-search
    volumes:
      - ./services/search:/var/www/html
      - search-vendor:/var/www/html/vendor
    ports:
      - "8003:8000"
    command: sh -c "composer install --no-scripts && sleep 15 && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      meilisearch:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - shared-capstone-network

  notification:
    build: ./services/notification
    container_name: cms-notification
    volumes:
      - ./services/notification:/var/www/html
      - notification-vendor:/var/www/html/vendor
    ports:
      - "8004:8000"
    command: sh -c "composer install --no-scripts && sleep 20 && php artisan migrate --force && (php artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=60 &) && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shared-capstone-network

  analytics-service:
    build: ./services/analytics-service
    container_name: cms-analytics-service
    volumes:
      - ./services/analytics-service:/var/www/html
      - analytics-service-vendor:/var/www/html/vendor
    ports:
      - "8005:8000"
    command: sh -c "composer install --no-scripts && sleep 5 && mysql --skip-ssl -h mysql -u root -p${MYSQL_PASSWORD} -e 'CREATE DATABASE IF NOT EXISTS \`cms-analytics-db\`;' && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shared-capstone-network

  ai-service:
    build: ./services/ai-service
    container_name: cms-ai-service
    volumes:
      - ./services/ai-service:/var/www/html
      - ai-service-vendor:/var/www/html/vendor
    ports:
      - "8006:8000"
    command: sh -c "composer install --no-scripts && sleep 5 && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-capstone-network

  # ── ClamAV Antivirus Daemon ──────────────────────
  clamav:
    image: clamav/clamav:1.4_base
    container_name: cms-clamav
    profiles:
      - scanning
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMAV_NO_CLAMD=false
      - CLAMAV_NO_MILTERD=true
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - shared-capstone-network

  # ── Vue Frontend ───────────────────────────────
  web:
    image: node:22-alpine
    container_name: cms-web
    working_dir: /app
    volumes:
      - ./frontend/web:/app
      - web-node-modules:/app/node_modules
    expose:
      - "5001"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5001"
    networks:
      - shared-capstone-network

networks:
  shared-capstone-network:
    external: true

volumes:
  mysql_data:
  postgres_data:
  meili_data:
  vendor-management-vendor:
  contract-management-vendor:
  search-vendor:
  notification-vendor:
  analytics-service-vendor:
  ai-service-vendor:
  web-node-modules:
  clamav_db:
